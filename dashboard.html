<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>运动场馆信息中心 - 数据看板</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="logo">🏟️ 运动场馆信息中心</h1>
      <nav class="nav-links">
        <a href="index.html">首页</a>
        <a href="venues.html">场馆查询</a>
        <a href="dashboard.html" class="active">数据看板</a>
        <a href="3d.html">三维展示</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2 class="page-title">📊 数据看板</h2>
    <div class="chart-grid">
      <div class="chart-box"><h3>🍎 运动类型分布</h3><canvas id="typeChart"></canvas></div>
      <div class="chart-box"><h3>📍 区域场馆数量</h3><canvas id="areaChart"></canvas></div>
      <div class="chart-box"><h3>💰 各场馆价格对比</h3><canvas id="priceChart"></canvas></div>
      <div class="chart-box"><h3>⭐ 类型平均评分</h3><canvas id="ratingChart"></canvas></div>
    </div>
  </main>

  <footer class="site-footer">
    <p>运动场馆信息中心 · 期末大作业 · 基于 Bootstrap + Chart.js + Three.js</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
