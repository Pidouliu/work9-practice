<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>运动场馆信息中心 - 场馆查询</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="logo">🏟️ 运动场馆信息中心</h1>
      <nav class="nav-links">
        <a href="index.html">首页</a>
        <a href="venues.html" class="active">场馆查询</a>
        <a href="dashboard.html">数据看板</a>
        <a href="3d.html">三维展示</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2 class="page-title">🔍 场馆查询</h2>

    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="搜索场馆名称...">
      <select id="typeFilter"><option value="">全部类型</option></select>
      <select id="areaFilter"><option value="">全部区域</option></select>
      <select id="sortSelect">
        <option value="default">默认排序</option>
        <option value="priceAsc">价格 ↑</option>
        <option value="priceDesc">价格 ↓</option>
        <option value="ratingDesc">评分 ↓</option>
        <option value="capacityDesc">容量 ↓</option>
      </select>
      <span class="ms-auto text-muted small" id="resultCount">共 0 条</span>
    </div>

    <div class="venue-grid" id="venueGrid"></div>

    <div class="modal fade" id="venueModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle">场馆详情</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="modalBody"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            <button type="button" class="btn btn-primary" id="bookBtn">立即预约</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>运动场馆信息中心 · 期末大作业 · 基于 Bootstrap + Chart.js + Three.js</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/venues.js"></script>
</body>
</html>
